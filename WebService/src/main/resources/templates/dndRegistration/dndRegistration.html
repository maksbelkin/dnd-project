<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dndRegistration/dndRegistration.css">
</head>
<body>
<div class="auth-card">
    <h2 class="auth-title">Регистрация</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form class="auth-form" action="/create-user" method="post" th:object="${userRegistrationCreateDto}">

        <div class="form-group">
            <label for="login" class="form-label">Логин</label>
            <input type="text" id="login" class="form-input" placeholder="Придумайте логин" th:field="*{login}">
            <div class="text-danger" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
        </div>

        <div class="form-group">
            <label for="role" class="form-label">Роль</label>
            <select id="role" class="form-input form-select" th:field="*{role}">
                <option value="">Выберите роль</option>
                <option value="MASTER">Мастер</option>
                <option value="PLAYER">Игрок</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Почта</label>
            <input type="email" id="email" class="form-input" placeholder="Введите ваш Email" th:field="*{email}">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" id="password" class="form-input" placeholder="Придумайте пароль" th:field="*{password}">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn-login">Зарегистрироваться</button>
    </form>

    <a href="/" class="forgot-password">Вернуться назад</a>
</div>
</body>
</html>
