<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — DnD</title>
    <link href="https://fonts.googleapis.com/css2?family=Pochaevsk&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dndProfileCss/dndProfileCss.css">
</head>
<body>

<nav class="nav">
    <a class="btnProfile nav-link" href="/profile">Профиль</a>
    <a class="btnYourForge nav-link" href="/dnd-your-forge">Создать игру</a>
    <a class="btnInformation nav-link" href="/dnd-information">Информация</a>
    <a class="btnSchedule nav-link" href="/dnd-schedule">Расписание</a>
    <a class="btnInstruction nav-link" href="/dnd-instruction">Инструкция</a>
    <a class="btnHelp nav-link" href="/dnd-help">Помощь</a>
</nav>

<div class="welcome-wrapper">
    <div class="welcome-block">

        <div class="profile-avatar">
            <img src="/img/img_tavern_dnd.jpg" alt="Аватар" class="profile-avatar__img">
        </div>

        <h1 class="welcome-sub" th:text="${user.role()}">MASTER</h1>

        <ul class="info-list">
            <li><strong>Логин:</strong> <span th:text="${user.login()}">dragon_master</span></li>
            <li><strong>Email:</strong> <span th:text="${user.email()}">dragon@mail.ru</span></li>
            <li><strong>Дата регистрации:</strong>
                <span th:text="${#temporals.format(user.createdAt(), 'dd.MM.yyyy')}">01.01.2025</span>
            </li>
            <div class="game-block" th:if="${user.role() != null and user.role().name() == 'PLAYER'}">
                <span class="game-block__label">Выбранные игры</span>

                <div th:if="${applications == null or #lists.isEmpty(applications)}"
                     class="game-block__placeholder">
                    <span class="game-block__icon">🎲</span>
                    <span>Игра пока не выбрана</span>
                </div>

                <div th:if="${applications != null and !#lists.isEmpty(applications)}">
                    <div th:each="app : ${applications}" class="game-applied">
                        <span class="game-applied__icon">🎲</span>
                        <span th:text="${app.gameName()}">Название игры</span>
                    </div>
                </div>
            </div>
        </ul>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
