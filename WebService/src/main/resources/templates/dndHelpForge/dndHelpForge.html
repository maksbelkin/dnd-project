<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Помощь</title>
    <link href="https://fonts.googleapis.com/css2?family=Pochaevsk&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dndHelpForgeCss/dndHelpForgeCss.css">
</head>
<body>
<nav class="nav">
    <a class="btnProfile nav-link" href="/profile">Профиль</a>
    <a class="btnYourForge nav-link" href="/dnd-your-forge">Создать игру</a>
    <a class="btnInformation nav-link" href="/dnd-information">Информация</a>
    <a class="btnSchedule nav-link" href="/dnd-schedule">Расписание</a>
    <a class="btnInstruction nav-link" href="/dnd-instruction">Инструкция</a>
    <a class="btnHelp nav-link" href="/dnd-help">Помощь</a>
</nav>

    <div class="help-container">
        <div class="success-wrapper">
            <div class="success-message" id="successMessage">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#4CAF50" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                <div>
                    <div class="success-title">Тикет был отправлен</div>
                    <div class="success-sub">Спасибо за внимательность!</div>
                </div>
            </div>
        </div>

        <div class="help-wrapper">
            <div class="help-content">
                <p class="help-subtitle">Оформление тикета</p>
                <p class="help-description">Укажите: что произошло, где произошло и когда.</p>

                <form id="ticketForm" class="ticket-form">
                    <div class="form-group">
                        <textarea 
                            class="form-control" 
                            id="ticketText" 
                            placeholder="Напишите..." 
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group priority-group">
                        <label class="priority-label">Выберите приоритет:</label>
                        <div class="priority-options">
                            <label class="priority-option">
                                <input type="radio" name="priority" value="not-urgent" checked>
                                <span>НЕ СРОЧНО</span>
                            </label>
                            <label class="priority-option">
                                <input type="radio" name="priority" value="urgent">
                                <span>СРОЧНО!</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Отправить</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/dndHelpForgeScript/dndHelpForgeScript.js"></script>
</body>
</html>
