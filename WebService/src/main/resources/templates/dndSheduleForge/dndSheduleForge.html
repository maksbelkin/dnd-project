<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание</title>
    <link href="https://fonts.googleapis.com/css2?family=Pochaevsk&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dndSheduleForgeCss/dndSheduleForgeCss.css">
</head>
<body>
<nav class="nav">
    <a class="btnProfile nav-link" href="/profile">Профиль</a>
    <a class="btnYourForge nav-link" href="/dnd-your-forge">Создать игру</a>
    <a class="btnInformation nav-link" href="/dnd-information">Информация</a>
    <a class="btnSchedule nav-link" href="/dnd-schedule">Расписание</a>
    <a class="btnInstruction nav-link" href="/dnd-instruction">Инструкция</a>
    <a class="btnHelp nav-link" href="/dnd-help">Помощь</a>
</nav>
<div th:if="${successMessage}" class="toast-plashka toast-success">
    <span>✉</span>
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage}" class="toast-plashka toast-error">
    <span>⚠</span>
    <span th:text="${errorMessage}"></span>
</div>
<div class="schedule-wrapper">
    <div class="schedule-grid" id="scheduleGrid">

        <div th:if="${#lists.isEmpty(games)}" class="empty-state">
            <div class="empty-state-icon">🎲</div>
            <div class="empty-state-title">
                Пока нет созданных игр
            </div>
        </div>

        <div class="card mb-3 schedule-card" th:each="game : ${games}">
            <div class="card-top">
                <div class="card-image">
                    <img th:src="${game.image != null ? game.image : '/img/main_default.webp'}"
                         class="img-fluid"
                         th:alt="${game.name}">
                </div>
                <div class="card-info">
                    <div class="card-date" th:text="${game.date}">12.06</div>
                    <div class="card-time" th:text="${game.time}">18:00 мск</div>
                    <div class="card-type"
                         th:text="${game.type.name() == 'VANSHOT' ? 'Ваншот' : 'Кампания'}">Ваншот</div>
                    <div class="card-level" th:text="${game.level}" th:if="${game.level != null}">3 lvl</div>
                </div>
            </div>
            <div class="card-bottom">
                <div class="card-title" th:text="${game.name}">Название игры</div>
                <div class="card-desc" th:text="${game.description}">Описание игры</div>

                <div class="card-actions">

                    <a th:if="${currentUserId != null and game.userId() != null and game.userId().equals(currentUserId)}"
                       th:href="@{/games/edit/{id}(id=${game.id()})}"
                       class="btn-card btn-edit">
                        ✎ Редактировать
                    </a>

                    <form th:if="${currentUserId != null and game.userId() != null and game.userId().equals(currentUserId)}"
                          th:action="@{/games/delete/{id}(id=${game.id()})}"
                          method="post" class="card-action-form">
                        <button type="submit" class="btn-card btn-delete"
                                onclick="return confirm('Вы уверены, что хотите удалить игру?');">
                            🗑 Удалить
                        </button>
                    </form>

                    <form th:if="${currentUserId != null and (game.userId() == null or !game.userId().equals(currentUserId))}"
                          th:action="@{/games/apply/{id}(id=${game.id()})}"
                          method="post" class="card-action-form">

                        <button th:if="${appliedGameIds != null and appliedGameIds.contains(game.id())}"
                                type="button"
                                class="btn-card btn-apply-disabled"
                                disabled>
                            ✅ Вы записаны
                        </button>

                        <button th:if="${appliedGameIds == null or !appliedGameIds.contains(game.id())}"
                                type="submit"
                                class="btn-card btn-apply">
                            🎲 Записаться
                        </button>
                    </form>

                </div>
            </div>
        </div>

    </div>

    <div class="pagination"></div>
</div>

<script src="/script/dndSheduleForgeScript/dndSheduleForgeScript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
